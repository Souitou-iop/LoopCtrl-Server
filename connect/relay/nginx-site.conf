# /etc/nginx/conf.d/RELAY_DOMAIN.conf: the relay on a name of its own
# (LOOPCTRL_RELAY_PUBLIC_SERVER=RELAY_DOMAIN). Certificate:
#   certbot certonly --webroot -w /var/www/acme -d RELAY_DOMAIN
server {
    listen 80;
    listen [::]:80;
    server_name RELAY_DOMAIN;
    location /.well-known/acme-challenge/ { root /var/www/acme; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name RELAY_DOMAIN;

    ssl_certificate /etc/letsencrypt/live/RELAY_DOMAIN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/RELAY_DOMAIN/privkey.pem;

    location / {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_request_buffering off;
        client_max_body_size 32m;
        proxy_read_timeout 1d;
        proxy_send_timeout 1d;
    }
}
