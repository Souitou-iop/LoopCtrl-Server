# /etc/nginx/conf.d/HEADSCALE_DOMAIN.conf
# Relies on the `map $http_upgrade $connection_upgrade` already defined in
# this server's nginx.conf. Certificate from: certbot --nginx -d HEADSCALE_DOMAIN
server {
    listen 80;
    listen [::]:80;
    server_name HEADSCALE_DOMAIN;

    # Tailscale captive portal detection.
    location = /generate_204 { return 204; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name HEADSCALE_DOMAIN;

    ssl_certificate /etc/letsencrypt/live/HEADSCALE_DOMAIN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/HEADSCALE_DOMAIN/privkey.pem;

    location / {
        proxy_pass http://127.0.0.1:8085;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Control and DERP connections are long-lived.
        proxy_buffering off;
        proxy_redirect http:// https://;
        proxy_read_timeout 1d;
        proxy_send_timeout 1d;
    }
}
