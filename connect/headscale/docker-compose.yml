# Headscale (control server + embedded DERP relay) for LoopCtrl's remote
# access, plus one operator node for testing. See README.md.
#
# Host networking for headscale: it listens on 127.0.0.1:8085 behind nginx
# (TLS) and on UDP 3478 for STUN, and sees real client addresses.
services:
  headscale:
    image: headscale/headscale:0.29.4
    container_name: headscale
    restart: unless-stopped
    network_mode: host
    command: serve
    volumes:
      - ./config:/etc/headscale:ro
      - ./data:/var/lib/headscale
      - ./run:/var/run/headscale

  # A tailnet node tagged tag:operator, standing in for our control server:
  # the policy lets only operator nodes reach customer phones. Userspace
  # networking with a SOCKS5 proxy on 127.0.0.1:1055, so it can't disturb
  # the host's own tailscaled. Join it with an operator pre-auth key in
  # TS_AUTHKEY (.env), see README.md.
  operator:
    image: tailscale/tailscale:v1.102.3
    container_name: loopctrl-operator
    restart: unless-stopped
    environment:
      TS_AUTHKEY: ${OPERATOR_AUTHKEY:-}
      TS_HOSTNAME: loopctrl-operator
      TS_EXTRA_ARGS: --login-server=https://${HEADSCALE_DOMAIN}
      TS_USERSPACE: "true"
      TS_SOCKS5_SERVER: 0.0.0.0:1055
      TS_STATE_DIR: /var/lib/tailscale
      TS_ACCEPT_DNS: "false"
    ports:
      - "127.0.0.1:1055:1055"
    volumes:
      - ./operator:/var/lib/tailscale
    depends_on:
      - headscale
